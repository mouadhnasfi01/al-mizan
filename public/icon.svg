<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="70%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0c0f0d" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="8" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.9"/>
  <!-- 8-pointed Islamic Star Octagram -->
  <g transform="translate(256, 256) scale(1.15)">
    <rect x="-80" y="-80" width="160" height="160" fill="none" stroke="url(#gold)" stroke-width="7" rx="8" />
    <rect x="-80" y="-80" width="160" height="160" fill="none" stroke="url(#gold)" stroke-width="7" rx="8" transform="rotate(45)" />
    <!-- Arabic Calligraphy Letter Meem (الميزان) -->
    <text x="0" y="32" font-family="'Amiri', 'Scheherazade New', serif" font-size="115" font-weight="bold" fill="url(#gold)" text-anchor="middle">م</text>
  </g>
</svg>
